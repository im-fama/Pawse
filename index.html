<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pawse</title>
    <meta name="description" content="A cozy little place to log how you're feeling." />
    <meta name="theme-color" content="#33241C" />
    <!-- Pawse has its own fixed palette: stop phone browsers (Chrome / Samsung
         Internet "dark mode for websites") from recolouring it. -->
    <meta name="color-scheme" content="only light" />
    <meta name="supported-color-schemes" content="light only" />
    <link rel="icon" type="image/png" href="/app-icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app-icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pawse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Electron's preload runs first, so this tells desktop and web apart before paint.
      document.documentElement.classList.add(window.electronAPI ? "is-electron" : "is-web");
      // Shrink the 397x550 window to fit short browser windows (never enlarge).
      (function () {
        function fit() {
          var scale = Math.min(1, (window.innerHeight - 32) / 550, (window.innerWidth - 32) / 397);
          document.documentElement.style.setProperty("--pawse-scale", Math.max(scale, 0.5));
        }
        fit();
        window.addEventListener("resize", fit);
      })();
    </script>
  </head>
  <body>
    <div class="web-backdrop" aria-hidden="true">
      <div class="web-glow web-glow-a"></div>
      <div class="web-glow web-glow-b"></div>
      <div class="web-glow web-glow-c"></div>

      <span class="web-cat" style="--x: 9%; --y: 18%; --img: url('/pet-moods/happy.png'); --delay: 0s"></span>
      <span class="web-cat" style="--x: 80%; --y: 14%; --img: url('/pet-moods/sleepy.png'); --delay: -2.5s"></span>
      <span class="web-cat" style="--x: 12%; --y: 72%; --img: url('/pet-moods/cozy.png'); --delay: -4s"></span>
      <span class="web-cat" style="--x: 78%; --y: 70%; --img: url('/pet-moods/in_love.png'); --delay: -1.2s"></span>

      <span class="web-paw" style="--x: 4%;  --size: 22px; --dur: 19s; --delay: 0s;   --rot: -20deg"></span>
      <span class="web-paw" style="--x: 14%; --size: 30px; --dur: 24s; --delay: -6s;  --rot: 15deg"></span>
      <span class="web-paw" style="--x: 24%; --size: 18px; --dur: 17s; --delay: -11s; --rot: -8deg"></span>
      <span class="web-paw" style="--x: 33%; --size: 26px; --dur: 22s; --delay: -3s;  --rot: 25deg"></span>
      <span class="web-paw" style="--x: 42%; --size: 16px; --dur: 20s; --delay: -15s; --rot: -30deg"></span>
      <span class="web-paw" style="--x: 55%; --size: 24px; --dur: 26s; --delay: -9s;  --rot: 10deg"></span>
      <span class="web-paw" style="--x: 64%; --size: 20px; --dur: 18s; --delay: -1s;  --rot: -15deg"></span>
      <span class="web-paw" style="--x: 73%; --size: 32px; --dur: 25s; --delay: -13s; --rot: 30deg"></span>
      <span class="web-paw" style="--x: 83%; --size: 18px; --dur: 21s; --delay: -5s;  --rot: -25deg"></span>
      <span class="web-paw" style="--x: 92%; --size: 26px; --dur: 23s; --delay: -17s; --rot: 12deg"></span>

      <p class="web-caption">pawse <span class="web-caption-paw"></span></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
